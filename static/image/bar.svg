<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="40" fill="#0b5180"/>
      <rect x="20" width="20" height="40" fill="#050505"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="#f0f8ff" stroke="#0b5180" stroke-width="2">
    <circle cx="300" cy="250" r="36"/>
    <circle cx="500" cy="250" r="36"/>
    <circle cx="360" cy="220" r="42"/>
    <circle cx="440" cy="220" r="42"/>
    <circle cx="400" cy="190" r="50"/>
    <circle cx="400" cy="265" r="44"/>
  </g>
  <polygon points="300,300 500,300 470,500 330,500" fill="url(#stripes)" stroke="#0c6eaa" stroke-width="3"/>
  <rect x="560" y="350" width="80" height="150" rx="8" fill="#0c6eaa"/>
  <rect x="552" y="338" width="96" height="16" rx="6" fill="#38bdf8"/>
  <line x1="600" y1="338" x2="615" y2="290" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <rect x="0" y="500" width="800" height="100" fill="#050505"/>
</svg>
