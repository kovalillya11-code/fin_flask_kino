<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#062a40"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5180"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0b5180"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Рамки, що розходяться від екрана -->
  <rect x="30" y="90" width="740" height="420" rx="12" fill="none" stroke="#0b5180" stroke-width="2" opacity="0.25"/>
  <rect x="60" y="110" width="680" height="380" rx="10" fill="none" stroke="#0c6eaa" stroke-width="2" opacity="0.4"/>
  <rect x="90" y="130" width="620" height="340" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Промені від країв екрана -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <line x1="120" y1="160" x2="30" y2="90"/>
    <line x1="680" y1="160" x2="770" y2="90"/>
    <line x1="120" y1="440" x2="30" y2="510"/>
    <line x1="680" y1="440" x2="770" y2="510"/>
  </g>

  <!-- Сам екран -->
  <rect x="120" y="160" width="560" height="280" rx="6" fill="url(#screen)" filter="url(#glow)" opacity="0.9"/>

  <!-- Підлога залу -->
  <rect x="0" y="520" width="800" height="80" fill="#050505"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#0b5180" stroke-width="2"/>
</svg>
