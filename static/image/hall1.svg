  <rect x="100" y="280" width="600" height="22" fill="url(#seat)"/>
  <rect x="100" y="320" width="600" height="22" fill="url(#seat)"/>
  <rect x="100" y="360" width="600" height="22" fill="url(#seat)"/>
  <rect x="100" y="400" width="600" height="22" fill="url(#seat)"/>
  <rect x="100" y="440" width="600" height="22" fill="url(#seat)"/>
  <rect x="0" y="500" width="800" height="100" fill="#050505"/>
