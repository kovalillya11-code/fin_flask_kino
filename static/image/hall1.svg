<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#0a1a26"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b5180" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0b5180" stop-opacity="0"/>
    </linearGradient>
    <pattern id="seat" width="34" height="30" patternUnits="userSpaceOnUse">
      <rect x="4" y="4" width="26" height="20" rx="6" fill="#0c6eaa" opacity="0.8"/>
